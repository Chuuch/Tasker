apiVersion: apps/v1
kind: Deployment

metadata:
  name: postgres
  namespace: tasker

spec:
  replicas: 1

  selector:
    matchLabels:
      app: postgres

  template:
    metadata:
      labels:
        app: postgres

    spec:
      containers:
        - name: postgres
          image: postgres:18

          ports:
            - containerPort: 5432

          env:
            - name: POSTGRES_USER
              value: tasker

            - name: POSTGRES_PASSWORD
              value: tasker_password

            - name: POSTGRES_DB
              value: tasker_db

          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/18/docker

      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-data
