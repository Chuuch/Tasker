apiVersion: batch/v1
kind: Job

metadata:
  name: tasker-migration
  namespace: tasker

spec:
  backoffLimit: 3

  template:
    spec:
      restartPolicy: OnFailure

      containers:
        - name: migrate
          image: migrate/migrate:v4.19.1

          command:
            - /bin/sh
            - -c

          args:
            - >
              migrate
              -path=/migrations
              -database=postgres://${DATABASE_USER}:${DATABASE_PASSWORD}@postgres:5432/${DATABASE_NAME}?sslmode=disable
              up

          env:
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: tasker-db-secret
                  key: POSTGRES_USER

            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tasker-db-secret
                  key: POSTGRES_PASSWORD

            - name: DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: tasker-db-secret
                  key: POSTGRES_DB

          volumeMounts:
            - name: migrations
              mountPath: /migrations

      volumes:
        - name: migrations
          configMap:
            name: tasker-migration
