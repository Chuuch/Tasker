replicaCount: 1

image:
  repository: ghcr.io/chuuch/tasker
  pullPolicy: IfNotPresent
  tag: latest

imagePullSecrets:
  - name: ghcr-secret

api:
  service:
    type: ClusterIP
    port: 8080

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

  livenessProbe:
    initialDelaySeconds: 5
    periodSeconds: 10

  readinessProbe:
    initialDelaySeconds: 2
    periodSeconds: 5

ingressRoute:
  enabled: true
  entryPoint: web
  host: tasker.local

database:
  image: postgres:18

  service:
    port: 5432

  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 512Mi

  storage:
    size: 1Gi

  secret:
    name: tasker-db-secret

config:
  DATABASE_HOST: tasker-postgres
  DATABASE_PORT: "5432"
  DATABASE_SSLMODE: disable

migration:
  image: migrate/migrate:v4.19.1

metrics:
  enabled: true
