apiVersion: v1
kind: Service

metadata:
  name: {{ include "tasker.fullname" . }}
  namespace: {{ .Release.Namespace }}

spec:
  type: {{ .Values.api.service.type }}

  selector:
    {{- include "tasker.selectorLabels" . | nindent 4 }}

  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
